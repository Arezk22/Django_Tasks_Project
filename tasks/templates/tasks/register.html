<!-- استيراد Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
  /* إضافة لمسة Bootstrap لحقول Django التلقائية */
  input[type="text"],
  input[type="password"],
  input[type="email"],
  textarea {
    display: block;
    width: 100%;
    padding: 0.5rem 0.75rem;
    font-size: 1rem;
    line-height: 1.5;
    color: #495057;
    background-color: #fff;
    border: 1px solid #ced4da;
    border-radius: 0.25rem;
    margin-bottom: 10px;
    /* مسافة بين الحقول */
  }

  /* تحسين شكل الـ help text اللي بيطلعه Django تحت الحقول */
  .helptext {
    display: block;
    font-size: 0.8rem;
    color: #6c757d;
    margin-bottom: 15px;
  }

  ul {
    list-style: none;
    padding: 0;
    color: #dc3545;
    font-size: 0.9rem;
  }

  /* لشكل أخطاء الـ Validation */
</style>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-lg border-0">
        <div class="card-header bg-success text-white text-center py-3">
          <h3 class="mb-0">Create Account</h3>
        </div>
        <div class="card-body p-4">
          <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <div class="d-grid gap-2 mt-4">
              <button type="submit" class="btn btn-success btn-block">Register</button>
            </div>
          </form>
        </div>
        <div class="card-footer text-center bg-light">
          <small>
            Already have an account? <a href="{% url 'login' %}"
              class=" text-decoration-none fw-bold text-success">Login
              here</a>
          </small>
        </div>
      </div>
    </div>
  </div>
</div>
